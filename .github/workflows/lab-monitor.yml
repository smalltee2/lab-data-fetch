name: Lab monitor snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 minutes (GitHub may delay scheduled runs a little)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-monitor
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests "huggingface_hub>=0.34"
      - env:
          GH_MONITOR_TOKEN: ${{ secrets.GH_MONITOR_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$GH_MONITOR_TOKEN" ] || [ -z "$HF_TOKEN" ]; then
            echo "Secrets GH_MONITOR_TOKEN / HF_TOKEN not set yet - skipping."; exit 0
          fi
          python monitor/snapshot.py
